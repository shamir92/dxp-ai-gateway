services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dxp
      POSTGRES_PASSWORD: dxp
      POSTGRES_DB: dxp_ai_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxp -d dxp_ai_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
